#
# Distro E2E (tests/distro/README.md): per target, build the krema package
# from this tree with the repo's packaging, build an image with that distro's
# KWin/Qt/KF plus the package installed through its package manager, and run
# the AT-SPI E2E suite (tests/appium) against /usr/bin/krema. This is the only
# CI run of that suite; e2e.yml builds and runs the CTest suites.
#
# Graphics: KWin's --virtual backend on an out-of-tree vgem (render node; the
# Azure runner kernel ships none), compositing with OpenGL through llvmpipe.
# The built module is cached keyed on the runner kernel release, so a hit
# skips the headers install and out-of-tree build. fedora-43 additionally
# reruns the @pytest.mark.outputs(2) tests with two
# virtual outputs; every other target skips them.
#
# Triggers: pull requests touching the product, a weekly schedule to catch
# rolling-distro drift (arch, opensuse-tumbleweed/slowroll, ...), and manual
# dispatch, which the release procedure (.claude/commands/release.md) runs on
# master before tagging.
#
# No image layer cache: package and image build in a few minutes per target,
# and twelve distro images would not fit the repository's 10 GB Actions
# cache, which e2e.yml also uses. Only the small vgem.ko is cached (per
# kernel release). The suite runs sharded in two (KREMA_E2E_SHARDS=2;
# tests/distro/run-distro-e2e.sh), all shards' JUnit files feed the summary.

name: Distro E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/distro-e2e.yml"
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets (comma/space separated ids from tests/distro/targets.tsv or 'arch'), or 'all'"
        required: false
        default: all

permissions: {}

concurrency:
  group: distro-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tests/distro/targets.tsv
          sparse-checkout-cone-mode: false

      - name: Resolve target list
        id: resolve
        env:
          REQUESTED: ${{ inputs.targets || 'all' }}
        run: |
          known="$(awk -F '\t' '/^[[:space:]]*#/ || NF < 4 { next } { print $1 }' tests/distro/targets.tsv; echo arch)"
          if [[ -z ${REQUESTED// } || $REQUESTED == all ]]; then
            selected="$known"
          else
            selected="$(tr -s ', ' '\n' <<<"$REQUESTED" | sed '/^$/d')"
            for t in $selected; do
              grep -qxF -- "$t" <<<"$known" || { echo "::error::unknown target '$t' (known: $(tr '\n' ' ' <<<"$known"))"; exit 1; }
            done
          fi
          matrix="$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' <<<"$selected")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "targets: $matrix"

  distro-e2e:
    name: Distro E2E (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Kernel release
        id: krel
        run: echo "release=$(uname -r)" >>"$GITHUB_OUTPUT"

      - name: Cache vgem module
        id: vgem-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/krema-e2e
          # The module is bound to the exact kernel release and to this
          # script's build recipe.
          key: vgem-${{ runner.os }}-${{ hashFiles('tests/appium/setup-vgem.sh') }}-${{ steps.krel.outputs.release }}

      - name: Build and load vgem (DRM render node)
        run: |
          if [ "${{ steps.vgem-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-headers-$(uname -r)" build-essential
          fi
          sudo VGEM_KO="$HOME/.cache/krema-e2e/vgem.ko" tests/appium/setup-vgem.sh

      - name: Run tests/distro/run-distro-e2e.sh (${{ matrix.target }})
        id: main
        env:
          KREMA_E2E_SHARDS: "2"
        run: tests/distro/run-distro-e2e.sh "$TARGET" -rs

      - name: JUnit summary
        if: always()
        run: |
          python3 .github/scripts/junit-summary.py "Distro E2E: $TARGET" \
            tests/appium/artifacts-distro-"$TARGET"/shard-*/junit.xml \
            --forbid-skip 'QPainter|render node' >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distro-e2e-${{ matrix.target }}
          path: tests/appium/artifacts-distro-${{ matrix.target }}
          if-no-files-found: ignore

      - name: Run tests/distro/run-distro-e2e.sh (fedora-43, 2 outputs)
        # --output-count 2 gives two side-by-side virtual outputs; -m outputs
        # collects only the @pytest.mark.outputs(2) tests, so the
        # single-output suite is not rerun and nothing shows as skipped.
        # Reuses the package and image the main run built, and runs even when
        # that run failed on a test.
        if: always() && matrix.target == 'fedora-43' && (steps.main.outcome == 'success' || steps.main.outcome == 'failure')
        env:
          KREMA_E2E_OUTPUT_COUNT: "2"
          KREMA_DISTRO_SKIP_IMAGE_BUILD: "1"
          KREMA_E2E_ARTIFACTS: tests/appium/artifacts-distro-fedora-43-2out
        run: tests/distro/run-distro-e2e.sh fedora-43 -m outputs -rs

      - name: JUnit summary (fedora-43, 2 outputs)
        if: always() && matrix.target == 'fedora-43'
        run: |
          python3 .github/scripts/junit-summary.py "Distro E2E: fedora-43 (2 outputs)" \
            tests/appium/artifacts-distro-fedora-43-2out/junit.xml \
            --forbid-skip 'QPainter|render node' >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && matrix.target == 'fedora-43'
        with:
          name: distro-e2e-fedora-43-2out
          path: tests/appium/artifacts-distro-fedora-43-2out
          if-no-files-found: ignore
