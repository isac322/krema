name: Distro release watch

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect and print planned actions without writing issues"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: distro-release-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check for new distro releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Detect missing distro releases and sync issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/check_distro_releases.py --dry-run
          else
            python3 scripts/check_distro_releases.py
          fi
