#
# Build & tests: inside the ctest-image stage of tests/appium/Dockerfile
# (Fedora, KWin, Qt/KF6 + ccache; no AT-SPI stack), build every target with
# BUILD_TESTING=ON and run the whole CTest suite except the Docker-based
# `e2e` label: Catch2 unit tests, the KWin integration tests
# (tests/integration, tests/kwin; each on a private `kwin_wayland --virtual`
# via tests/run-with-kwin.sh), the Qt Quick QML tests and the desktop-entry
# check. ctest runs with -j$(nproc); every test is parallel-safe by
# construction (private kwin session, private dbus-run-session bus,
# per-test mktemp XDG dirs).
#
# The AT-SPI E2E suite (tests/appium) runs in distro-e2e.yml, against the
# packaged krema on every supported distro including fedora-43.
#
# Image: the ctest ref of tests/distro/image-ref.sh, pulled from
# ghcr.io/isac322/krema-ci (published by ci-images.yml); when it is not
# there (a pull request changing tests/appium/Dockerfile) or the pull fails,
# tests/distro/build-ci-image.sh builds it locally.
#
# ccache: persisted with actions/cache, keyed on the image ref and the
# sources. Caches saved by a pull request are visible only to that pull
# request, so pushes to master and a daily schedule (after ci-images.yml's
# daily rebuild of the image, whose updated toolchain/headers miss the old
# cache) run this job on the default branch to seed
# the cache every pull request restores from.
#
# Path filter: the build is src/ and CMakeLists.txt, BUILD_TESTING=ON adds
# tests/ (tests/CMakeLists.txt), which adds tests/appium only with
# KREMA_E2E_TESTS=ON (off here). Of tests/appium only the Dockerfile (the
# image) is used; tests/distro contributes the two image scripts; tests/e2e
# holds scenario docs. packaging/ is not built here.

name: Build & tests

on:
  pull_request:
    paths: &paths
      - "src/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "!tests/appium/**"
      - "tests/appium/Dockerfile"
      - "!tests/distro/**"
      - "tests/distro/image-ref.sh"
      - "tests/distro/build-ci-image.sh"
      - "!tests/e2e/**"
      - "!**/*.md"
      - ".github/workflows/e2e.yml"
      - ".github/scripts/junit-summary.py"
  push:
    branches: [master]
    paths: *paths
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false

      # Public package: pulls also work anonymously, so a failed login (a
      # fork's token) only costs the rate limit, never the run.
      - name: Log in to ghcr.io
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"

      - name: Test image (ghcr.io, else local build)
        id: image
        run: |
          t0=$SECONDS
          ref="$(tests/distro/build-ci-image.sh --pull ctest)"
          echo "[e2e] image $ref: $((SECONDS - t0))s"
          {
            echo "ref=$ref"
            echo "tag=${ref##*:}"
          } >>"$GITHUB_OUTPUT"

      - name: ccache cache
        uses: actions/cache@v6
        with:
          path: .ccache
          # Image identity (package set/toolchain) + source hash in the key;
          # restore-keys falls back to the newest dir for this image, then
          # to any.
          key: ccache-${{ runner.arch }}-${{ steps.image.outputs.tag }}-${{ hashFiles('src/**', 'tests/**', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ steps.image.outputs.tag }}-
            ccache-${{ runner.arch }}-

      - name: Build and run ctest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          mkdir -p test-results .ccache
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/test-results:/results" \
            -v "$PWD/.ccache:/ccache" \
            -e HOST_UID="$(id -u)" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=500M \
            "$IMAGE" sh -euc '
              umask 022  # container runs as root; keep cache/results readable by the runner
              trap "chown -R $HOST_UID /results /ccache" EXIT
              # Writable copy without .git: configuring a git checkout
              # installs the ECM pre-commit hook into .git/hooks.
              rsync -a --exclude /.git/ --exclude /.ccache/ /src/ /work/
              ccache -z
              cmake -S /work -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                >/results/cmake-configure.log 2>&1 || { tail -n 80 /results/cmake-configure.log; exit 1; }
              cmake --build /tmp/build >/results/build.log 2>&1 \
                || { tail -n 80 /results/build.log; exit 1; }
              rc=0
              ctest --test-dir /tmp/build -LE e2e --output-on-failure --no-tests=error \
                -j"$(nproc)" --output-junit /results/junit.xml || rc=$?
              ccache -s
              exit $rc'

      - name: JUnit summary
        if: always()
        run: python3 .github/scripts/junit-summary.py "Build & tests" test-results/junit.xml >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
