name: UI frame tests

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "src/**"
      - "tests/ci/**"
      - "CMakeLists.txt"
      - ".github/workflows/frame-tests.yml"
  workflow_dispatch:

concurrency:
  group: frame-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frame-tests:
    name: Deterministic UI frame capture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare artifact directory
        run: |
          mkdir -p "$RUNNER_TEMP/frames"
          touch "$RUNNER_TEMP/frames/.keep"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image carries kwin_wayland plus krema's build dependencies, so the
      # runner needs nothing beyond an unprivileged container. No /dev/dri, no
      # --privileged, no --cap-add: the Dockerfile strips kwin_wayland's
      # cap_sys_nice file capability, which is what would otherwise make
      # execve() fail with EPERM inside a container.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: tests/ci
          file: tests/ci/Dockerfile
          tags: krema-ui-ci:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run frame scenarios
        run: |
          docker run --rm \
            -e KREMA_VIDEO=1 \
            -e KREMA_PREVIEW_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/ci-media/pr-${{ github.event.pull_request.number || 0 }}/${{ github.run_id }}" \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/frames:/out" \
            krema-ui-ci:local \
            bash /src/tests/ci/run-frame-tests.sh

      - name: Validate CI tools and QA coverage
        if: always()
        run: |
          python3 -m unittest tests/ci/test_ci_tools.py
          python3 tests/ci/qa_coverage.py --check

      # Artifacts download as a zip and cannot be played in the browser, so the
      # numbers a reviewer needs go on the job page itself. The videos are for
      # when the numbers are not enough.
      - name: Job summary
        if: always()
        run: python3 tests/ci/summarize.py --src . --run-dir "$RUNNER_TEMP/frames" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frame artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-captures
          path: ${{ runner.temp }}/frames
          include-hidden-files: true
          retention-days: 14

  publish-previews:
    name: Publish inline previews
    needs: frame-tests
    if: >-
      ${{ always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job never checks out or executes pull-request source. Its write
      # token is exposed only to the fixed publication steps below.
      - name: Download frame artifacts
        uses: actions/download-artifact@v4
        with:
          name: frame-captures
          path: ${{ runner.temp }}/frames

      # GitHub will not play a video inline: raw .mp4 and release assets both
      # download as application/octet-stream. Raw GIF URLs render inline, so the
      # generated animations live on a parentless ci-media branch.
      - name: Publish preview animations
        id: previews
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          shopt -s nullglob
          previews=("$RUNNER_TEMP/frames/previews"/*.gif)
          if ((${#previews[@]} == 0)); then
            echo "no animations to publish"
            exit 0
          fi

          publish_previews() {
            local work="$RUNNER_TEMP/ci-media"
            rm -rf "$work"
            local base
            if git clone --depth 1 --branch ci-media \
                 "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" \
                 "$work" 2>/dev/null; then
              base=$(git -C "$work" rev-parse HEAD)
            else
              rm -rf "$work"; mkdir -p "$work"; base=""
            fi
            rm -rf "${work:?}/.git"
            git init -q "$work"
            rm -rf "${work:?}/pr-$PR"
            mkdir -p "$work/pr-$PR/$GITHUB_RUN_ID"
            cp "${previews[@]}" "$work/pr-$PR/$GITHUB_RUN_ID/"
            git -C "$work" config user.name "github-actions[bot]"
            git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$work" add -A
            git -C "$work" commit -q -m "ci: preview animations for pr-$PR run $GITHUB_RUN_ID"
            local lease=("--force")
            if [[ -n "$base" ]]; then
              lease=("--force-with-lease=ci-media:$base")
            fi
            git -C "$work" push -q "${lease[@]}" \
              "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" \
              HEAD:ci-media
          }

          for attempt in 1 2 3 4 5; do
            if publish_previews; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ci-media moved under us; retry $attempt"
            sleep $((attempt * 5))
          done
          echo "could not publish previews"

      # Find the bot's marker comment and PATCH it. `gh pr comment --edit-last`
      # can create a second stale comment instead of editing the existing one.
      - name: Comment on the pull request
        if: steps.previews.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/frames/previews/comment.md"
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- krema-frame-tests -->"))) | .[-1].id // empty')
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@"$body" >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@"$body" >/dev/null
            echo "created comment"
          fi
