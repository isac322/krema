#
# Tier-3 full-session VM QA (tests/vm/README.md): per target, build the
# distro package from this tree, boot the official cloud image under KVM,
# provision Plasma 6 Wayland + SDDM autologin, install the package through
# the distro package manager and verify krema inside the live session.
#
# Too heavy for pull requests: runs on demand, on published releases and
# weekly. Golden (Plasma-provisioned) images are cached per target, keyed on
# the provisioning inputs and the upstream image checksum.

name: VM QA

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets (comma/space separated target ids from tests/docker/targets.tsv or 'arch'), or 'all'"
        required: false
        default: all
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: vm-qa-${{ github.ref }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false

jobs:
  targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tests/docker/targets.tsv
          sparse-checkout-cone-mode: false

      - name: Resolve target list
        id: resolve
        env:
          REQUESTED: ${{ inputs.targets || 'all' }}
        run: |
          known="$(awk -F '\t' '/^[[:space:]]*#/ || NF < 4 { next } { print $1 }' tests/docker/targets.tsv; echo arch)"
          if [[ -z ${REQUESTED// } || $REQUESTED == all ]]; then
            selected="$known"
          else
            selected="$(tr -s ', ' '\n' <<<"$REQUESTED" | sed '/^$/d')"
            for t in $selected; do
              grep -qxF -- "$t" <<<"$known" || { echo "::error::unknown target '$t' (known: $(tr '\n' ' ' <<<"$known"))"; exit 1; }
            done
          fi
          matrix="$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' <<<"$selected")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "targets: $matrix"

  vm-qa:
    name: VM QA (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      PKG_OUT: ${{ github.workspace }}/vm-packages
      KREMA_VM_CACHE: ${{ github.workspace }}/tests/vm/.cache
      KREMA_VM_ARTIFACTS: ${{ github.workspace }}/tests/vm/artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free runner disk space
        # Golden images reach several GB and the cache save stages another
        # copy; the stock toolchains we never use are the cheapest to drop.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso genisoimage cloud-image-utils

      - name: Build package (${{ matrix.target }})
        timeout-minutes: 60
        run: tests/vm/build-package.sh "$TARGET" "$PKG_OUT"

      - name: Provisioning fingerprint
        id: fp
        # Changes whenever run-vm-qa.sh would reprovision: the distro
        # plug-in, the shared provisioning code, or the upstream image.
        # Resolution runs without errexit, as in run-vm-qa.sh; a failure
        # only means a cache miss here and a clear error in the next step.
        run: |
          family="$(awk -F '\t' -v t="$TARGET" '$1 == t { print $2 }' tests/docker/targets.tsv)"
          [[ -n $family ]] || family="$TARGET"   # arch
          image="$(bash -c 'set -uo pipefail
            source tests/vm/lib/common.sh
            TARGET_ID="$1" FAMILY="$2"
            source "tests/vm/distros/$2.sh"
            distro_image' _ "$TARGET" "$family")" || image="unresolved-$GITHUB_RUN_ID"
          echo "image: $image"
          # Key on the checksum (mirror URLs vary); the URL only when unverified.
          image_id="${image##* }"
          [[ $image_id =~ ^[0-9a-f]{64}$|^sha512: ]] || image_id="$image"
          inputs="$(cat "tests/vm/distros/$family.sh" tests/vm/lib/cloud-init.sh tests/vm/guest/cargo-install.sh | sha256sum | cut -c1-16)"
          echo "key=${inputs}-$(sha256sum <<<"$image_id" | cut -c1-16)" >>"$GITHUB_OUTPUT"

      - name: Restore golden image
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: tests/vm/.cache/${{ matrix.target }}
          key: vm-qa-golden-${{ matrix.target }}-${{ steps.fp.outputs.key }}

      - name: Run VM QA (${{ matrix.target }})
        timeout-minutes: 80
        run: tests/vm/run-vm-qa.sh "$TARGET" "$PKG_OUT/$TARGET"

      - name: Check golden image
        id: golden
        if: always()
        run: |
          if [[ -f tests/vm/.cache/$TARGET/golden.key && -f tests/vm/.cache/$TARGET/golden.qcow2 ]]; then
            # base.qcow2 is only needed to reprovision; keep the cache small.
            rm -f "tests/vm/.cache/$TARGET/base.qcow2" "tests/vm/.cache/$TARGET/base.qcow2.sha256"
            echo "present=true" >>"$GITHUB_OUTPUT"
            du -sh "tests/vm/.cache/$TARGET"
          fi

      - name: Save golden image
        # Saved even when verification fails: provisioning is the slow part
        # and is independent of the krema package under test.
        if: always() && steps.cache.outputs.cache-hit != 'true' && steps.golden.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/vm/.cache/${{ matrix.target }}
          key: vm-qa-golden-${{ matrix.target }}-${{ steps.fp.outputs.key }}

      - name: JUnit summary
        if: always()
        run: |
          python3 .github/scripts/junit-summary.py "VM QA: $TARGET" "tests/vm/artifacts/$TARGET/junit.xml" >>"$GITHUB_STEP_SUMMARY"
          if [[ -f tests/vm/artifacts/$TARGET/summary.txt ]]; then
            { echo '```'; cat "tests/vm/artifacts/$TARGET/summary.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-qa-${{ matrix.target }}
          path: |
            tests/vm/artifacts/${{ matrix.target }}
            !tests/vm/artifacts/${{ matrix.target }}/.work.*
          if-no-files-found: ignore
